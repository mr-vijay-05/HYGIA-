[project]
name = "hygia"
version = "0.1.0"
description = "HYGIA medical document intelligence API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.4",
    "PyMuPDF==1.28.2",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
    "numpy>=2.3.5",
    "paddleocr>=3.5.0",
    "paddlepaddle==3.2.2",
]

[tool.pyright]
include = ["backend"]
extraPaths = ["backend"]
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
